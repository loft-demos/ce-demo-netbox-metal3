# NetBox connector for vCluster Platform.
#
# WHERE: the Platform namespace on the Platform's OWN cluster (default
# `vcluster-platform`). Not the Metal3 cluster, even when the BareMetalHosts and
# NetBox itself live there. The UI lists connectors from exactly that namespace
# (Connectors -> NetBox), and a NodeProvider's spec.metal3.netBox.secretRef must
# point at it by namespace + name.
#
# The label is what makes it a connector; without it the platform refuses the
# Secret by name rather than by content, and the UI will not list it either.
#
# Keys:
#   url       base URL of NetBox, http or https, no trailing /api
#   apiToken  a NetBox API token, value only, no scheme word (see below)
#   insecure  "true" to skip TLS verification (self-signed certs)
#
# PASTE THE VALUE, NOT THE HEADER. NetBox shows a new token once, as the whole
# Authorization header: "Bearer nbt_<key>.<secret>" for v2, "Token <40 chars>"
# for v1. apiToken takes only what follows the space.
#
# Either version authenticates. NetBox accepts both scheme keywords and infers
# the version from the value (anything starting nbt_ is v2), so the platform's
# hardcoded "Token" prefix carries a v2 token fine. Prefer v1 anyway for a
# long-lived connector: a v2 token is an HMAC digest keyed by API_TOKEN_PEPPERS,
# which is NetBox configuration rather than database state, so it stops working
# if the peppers are regenerated or the database moves under a different NetBox
# deployment. A v1 token's plaintext lives in the database and survives both.
#
# Give the platform a READ-ONLY token. The import has no write path, and a
# read-only token is how you prove that to whoever asks.
#
# Create it out-of-band rather than committing the token:
#   kubectl --context "$PLATFORM_CONTEXT" -n "$PLATFORM_NAMESPACE" \
#     create secret generic netbox \
#     --from-literal=url="$NETBOX_URL" \
#     --from-literal=apiToken="$NETBOX_PLATFORM_TOKEN" \
#     --from-literal=insecure=false
#   kubectl --context "$PLATFORM_CONTEXT" -n "$PLATFORM_NAMESPACE" \
#     label secret netbox loft.sh/connector-type=netbox
#
# This file is the shape: for reference, and for GitOps once the token lives in
# a sealed or external secret.
apiVersion: v1
kind: Secret
metadata:
  name: netbox
  namespace: vcluster-platform
  labels:
    loft.sh/connector-type: netbox
  annotations:
    # Shown as the connector's name in the Platform UI. Name the NetBox
    # instance, not the feature, if you expect to end up with more than one.
    loft.sh/display-name: "NetBox"
type: Opaque
stringData:
  url: https://<netbox-hostname>
  apiToken: REPLACE_WITH_A_READ_ONLY_NETBOX_TOKEN
  insecure: "false"
