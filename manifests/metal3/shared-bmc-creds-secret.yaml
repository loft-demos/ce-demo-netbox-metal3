# OPTIONAL - only for the "no BMC passwords in NetBox" variant.
#
# By default the import reads bmc_username / bmc_password from each NetBox
# device's custom fields and writes a per-host Secret `<host>-bmc` next to the
# BareMetalHost, keeping it current when the login rotates in NetBox. That is
# the feature worth demoing, and it is what
# manifests/platform/metal3-node-provider-netbox.fragment.yaml configures.
#
# The trade-off: a NetBox text custom field stores the password in plain text
# and shows it to anyone who can view the device. (The platform never serves it
# back through its own API -- it is stripped from the machine projection -- but
# NetBox itself will.) Whether that is acceptable depends on who can read your
# NetBox, which is a question worth asking out loud during a demo rather than
# being asked.
#
# Three ways out, in rough order of how well they hold up:
#
#   1. Point spec.metal3.netBox.customFields at custom fields your NetBox
#      already protects, if it has any.
#   2. Use a shared BMC login, pinned by the provider's host template, as below.
#   3. Leave the fields empty and pin bootMACAddress + bmc.credentialsName in
#      the template, so NetBox holds no credentials at all.
#
# For (2), pin the Secret in the provider:
#
#   bareMetalHostTemplate:
#     spec:
#       bmc:
#         credentialsName: redfish-shared-creds
#
# A template that pins bmc.credentialsName makes the login custom fields
# optional (BMCCredentials drops out of the "missing requirements" check) and
# stops the import from writing per-host Secrets at all. The obvious cost is
# that every machine then shares one login, which is fine for an emulated fleet
# and rarely fine for a real one.
#
# This Secret is yours to manage: the import never writes it and never deletes
# it. On cleanup the release only ever deletes the name it would have written
# itself, `<host>-bmc`, so a shared Secret under any other name survives every
# untag. Do not name it `<host>-bmc` for some host -- see
# docs/troubleshooting.md, "A Secret named <host>-bmc disappeared".
#
# Apply to the cluster where the BareMetalHosts live, in the Metal3 namespace.
apiVersion: v1
kind: Secret
metadata:
  name: redfish-shared-creds
  namespace: metal3-system
type: Opaque
stringData:
  username: <bmc-username>
  password: <bmc-password>
